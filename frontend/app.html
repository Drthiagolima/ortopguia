var LGPD_DEFAULT_RETENTION_DAYS=365;

function canAccessTab(tab){
  var s=getSession()||{};
  var role=s.role||"paciente";
  return (ROLE_ALLOWED_TABS[role]||[]).indexOf(tab)!==-1;
}
function normalizePatient(p){
  var c=Object.assign({},p||{});
  if(!c.createdAt)c.createdAt=new Date().toISOString();
  if(!c.updatedAt)c.updatedAt=c.createdAt;
  if(!c.retentionUntil)c.retentionUntil=new Date(Date.parse(c.updatedAt)+LGPD_DEFAULT_RETENTION_DAYS*24*60*60*1000).toISOString();
  return c;
}
function loadPatients(){
  try{
    var raw=localStorage.getItem(PATIENT_STORAGE_KEY);
    if(raw){
      var arr=JSON.parse(raw);
      if(Array.isArray(arr)&&arr.length)return arr.map(normalizePatient);
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(PATIENTS)).map(normalizePatient);
}
function savePatients(){
  try{localStorage.setItem(PATIENT_STORAGE_KEY,JSON.stringify(state.patients.map(normalizePatient)))}catch(e){}
}
function touchPatient(pt){
  if(!pt)return;
  pt.updatedAt=new Date().toISOString();
  pt.retentionUntil=new Date(Date.parse(pt.updatedAt)+LGPD_DEFAULT_RETENTION_DAYS*24*60*60*1000).toISOString();
}
function getSession(){
  try{return JSON.parse(localStorage.getItem("ortopguia:session")||"null")}catch(e){return null}
}
function sessionIsValid(s){
  if(!s||!s.email||!s.role)return false;
  if(!s.lgpdAccepted)return false;
  if(!s.expiresAt)return false;
  if((s.role==="medico"||s.role==="secretaria")&&!s.accessToken)return false;
  var exp=Date.parse(s.expiresAt);
  if(!isFinite(exp))return false;
  return Date.now()<exp;
}
function requireValidSession(){
  var s=getSession();
  if(!sessionIsValid(s)){
    try{localStorage.removeItem("ortopguia:session")}catch(e){}
    window.location.href="index.html";
    return false;
  }
  return true;
}
function auditLog(action,meta,outcome){
  try{
    var s=getSession()||{};
    var arr=JSON.parse(localStorage.getItem("ortopguia:audit")||"[]");
    var nowIso=new Date().toISOString();
    arr.push({
      at:nowIso,
      email:s.email||"",
      role:s.role||"",
      sessionId:s.sid||"",
      tab:state&&state.tab?state.tab:"",
      action:action,
      outcome:outcome||"ok",
      meta:meta||{},
      retentionUntil:new Date(Date.parse(nowIso)+LGPD_DEFAULT_RETENTION_DAYS*24*60*60*1000).toISOString()
    });
    if(arr.length>1000)arr=arr.slice(arr.length-1000);
    localStorage.setItem("ortopguia:audit",JSON.stringify(arr));
  }catch(e){}
}
function roleIsSecretaria(){

}
function roleIsMedicoSenior(){
  var s=getSession()||{};
  var r=String(s.role||"").toLowerCase();
  var e=String(s.email||"").toLowerCase();
  if(r.indexOf("senior")!==-1)return true;
  if(r.indexOf("ortopedista_senior")!==-1)return true;
  if(r.indexOf("medico_senior")!==-1)return true;

  var fallback=state.patients.filter(function(p){return p.tipo===mode})[0]||state.patients[0]||null;
  if(!pid)return fallback;
  var chosen=getPatientById(pid);
  if(chosen&&chosen.tipo===mode)return chosen;
  return fallback;
}

}
function allTimeSlots(){
  var out=[];
  for(var h=8;h<=18;h++){
    out.push(pad2(h)+":00");
    if(h<18)out.push(pad2(h)+":30");
  }
  return out;
}
function getFreeSlots(dateIso,excludePatientId){
  var occ={};
  state.patients.forEach(function(pt){
    if(pt.id!==excludePatientId && getPatientDate(pt)===dateIso && pt.hora){occ[pt.hora]=true}
  });
  return allTimeSlots().filter(function(h){return !occ[h]});
}
function getPatientById(id){return state.patients.filter(function(p){return p.id===id})[0]||null}
function modePatientId(mode){
  var m=mode==="tele"?"teleconsulta":"presencial";
  var pt=selectedPatientForMode(m);
  return pt?pt.id:null;
}
function ensureRebookTime(mode){
  var pid=modePatientId(mode);
  var rb=state.rebook[mode];
  var free=getFreeSlots(rb.date,pid);
  if(free.indexOf(rb.time)===-1){rb.time=free[0]||""}
}
function setRebookDate(mode,v){state.rebook[mode].date=v;ensureRebookTime(mode);render()}
function setRebookTime(mode,v){state.rebook[mode].time=v}
function saveRebook(mode){
  if(roleIsSecretaria()){denyAction("rebook_denied_secretaria");return}
  var pid=modePatientId(mode);
  var rb=state.rebook[mode];
  var pt=getPatientById(pid);
  if(!pt||!rb.date||!rb.time)return;
  var free=getFreeSlots(rb.date,pid);
  if(free.indexOf(rb.time)===-1){alert("Horário indisponível. Escolha um horário livre.");ensureRebookTime(mode);render();return}
  pt.data=rb.date;
  pt.hora=rb.time;
  touchPatient(pt);
  savePatients();
  auditLog("rebook_consultation",{mode:mode,patientId:pid,newDate:rb.date,newTime:rb.time});
  alert("Reagendamento realizado para "+fmtDateBR(rb.date)+" às "+rb.time+".");
  render();
}

  var pid=modePatientId(mode);

}

function mirrorFrontGeometryForAnatomicalLaterality(){
  // Em vista frontal, a lateralidade anatômica precisa ser espelhada em relação ao observador.
  BODY_SEGMENTS.forEach(function(seg){
    if(seg.view!=="front")return;
    var id=String(seg.id||"");
    if(!/_(e|d)$/.test(id))return;
    var x=Number(seg.x||0);
    var w=Number(seg.w||0);
    seg.x=100-(x+w);
  });
  BODY_MARKERS.forEach(function(marker){
    if(marker.view!=="front")return;
    var id=String(marker.id||"");
    if(!/_(e|d)(?:_|$)/.test(id))return;
    // Costelas laterais já estão corretas no layout base e não devem ser espelhadas.
    if(id==="front_costelas_e"||id==="front_costelas_d")return;
    marker.x=100-Number(marker.x||50);
  });
}

    }else if(/antebraco/.test(id)){
      x=left?0.5:(right?-0.5:0);
      y=-0.3;
    }else if(/mao/.test(id)){
      x=left?0.6:(right?-0.6:0);
      y=-0.1;
    }else if(/quadril/.test(id)){
      x=left?0.2:(right?-0.2:0);
      y=-0.1;
    }else if(/coxa/.test(id)){
      x=left?0.5:(right?-0.5:0);
      y=-0.2;
    }else if(/joelho/.test(id)){
      x=left?0.3:(right?-0.3:0);
      y=-0.1;
    }else if(/perna/.test(id)){
      x=left?0.4:(right?-0.4:0);
      y=-0.1;
    }else if(/tornozelo/.test(id)){
      x=left?0.3:(right?-0.3:0);
      y=-0.1;
    }else if(/pe/.test(id)){
      x=left?0.4:(right?-0.4:0);
      y=0.1;
    }else if(/cervical|dorsal|lombar|sacra/.test(id)){
      x=0;
      y=0;
    }else if(/costelas/.test(id)){
      x=0;
      y=0;
    }
    preset[id]={x:x,y:y};
  });
  return preset;
}

function loadMarkerCalibrationStore(){
  if(markerCalibrationCache&&typeof markerCalibrationCache==="object")return markerCalibrationCache;
  try{
    var raw=localStorage.getItem(MARKER_CALIBRATION_STORAGE_KEY);
    var parsed=raw?JSON.parse(raw):{};
    var store=(parsed&&typeof parsed==="object")?parsed:{};
    var preset=buildMarkerCalibrationPreset();
    if(!raw||!Object.keys(store).length){
      store=preset;
    }else{
      Object.keys(preset).forEach(function(id){
        if(!store[id])store[id]=preset[id];
      });
    }
    markerCalibrationCache=store;
  }catch(e){
    markerCalibrationCache=buildMarkerCalibrationPreset();
  }
  return markerCalibrationCache;
}

function saveMarkerCalibrationStore(){
  try{
    localStorage.setItem(MARKER_CALIBRATION_STORAGE_KEY,JSON.stringify(loadMarkerCalibrationStore()));
  }catch(e){}
}

function markerCalibrationOffset(markerId){
  var store=loadMarkerCalibrationStore();
  var entry=store[String(markerId||"")];
  if(!entry||typeof entry!=="object")return {x:0,y:0};
  return {x:Number(entry.x||0),y:Number(entry.y||0)};
}

function setMarkerCalibrationOffset(markerId,offset){
  var id=String(markerId||"");
  if(!id)return;
  var store=loadMarkerCalibrationStore();
  store[id]={x:Number(offset&&offset.x||0),y:Number(offset&&offset.y||0)};
  markerCalibrationCache=store;
  saveMarkerCalibrationStore();
}

function setMarkerCalibrationOffsetRuntime(markerId,offset,persist){
  var id=String(markerId||"");
  if(!id)return;
  var store=loadMarkerCalibrationStore();
  store[id]={x:Number(offset&&offset.x||0),y:Number(offset&&offset.y||0)};
  markerCalibrationCache=store;
  if(persist!==false)saveMarkerCalibrationStore();
}

function adjustMarkerCalibration(markerId,dx,dy){
  var id=String(markerId||"");
  if(!id)return;
  var current=markerCalibrationOffset(id);
  setMarkerCalibrationOffset(id,{x:Math.round((current.x+Number(dx||0))*10)/10,y:Math.round((current.y+Number(dy||0))*10)/10});
}

function clearMarkerCalibration(markerId){
  var id=String(markerId||"");
  if(!id)return;
  var store=loadMarkerCalibrationStore();
  delete store[id];
  markerCalibrationCache=store;
  saveMarkerCalibrationStore();
}

function clearAllMarkerCalibration(){
  markerCalibrationCache={};
  saveMarkerCalibrationStore();
}

function applyMarkerCalibrationPreset(){
  markerCalibrationCache=buildMarkerCalibrationPreset();
  saveMarkerCalibrationStore();
}

function triageHandleMarkerClick(mode,markerId){
  if(window.__triageDragSuppressClickUntil&&Date.now()<window.__triageDragSuppressClickUntil)return;
  var t=triageModeState(mode);
  if(t&&t.calibration&&t.calibration.active){
    triageSelectCalibrationMarker(mode,markerId);
    return;
  }
  triageToggleMarker(mode,markerId);
}

function triagePointerXY(evt){
  if(!evt)return {x:0,y:0};
  if(evt.touches&&evt.touches.length)return {x:Number(evt.touches[0].clientX||0),y:Number(evt.touches[0].clientY||0)};
  if(evt.changedTouches&&evt.changedTouches.length)return {x:Number(evt.changedTouches[0].clientX||0),y:Number(evt.changedTouches[0].clientY||0)};
  return {x:Number(evt.clientX||0),y:Number(evt.clientY||0)};
}

function triageStartCalibrationDrag(evt,mode,markerId){
  var t=triageModeState(mode);
  if(!t||!t.calibration||!t.calibration.active)return;
  var el=evt&&evt.currentTarget;
  if(!el)return;
  triageSelectCalibrationMarker(mode,markerId,true);
  var fig=el.closest('.mini-figure');
  if(!fig)return;
  var p=triagePointerXY(evt);
  var rect=fig.getBoundingClientRect();
  var offset=markerCalibrationOffset(markerId);
  var drag={
    mode:mode,
    markerId:String(markerId||''),
    el:el,
    fig:fig,
    startX:p.x,
    startY:p.y,
    baseX:Number(offset.x||0),
    baseY:Number(offset.y||0),
    anchorX:Number(el.getAttribute('data-base-x')||50),
    anchorY:Number(el.getAttribute('data-base-y')||50),
    width:Math.max(1,Number(rect.width||1)),
    height:Math.max(1,Number(rect.height||1)),
    moved:false
  };
  window.__triageCalibrationDrag=drag;
  window.__triageCalibrationDragMove=triageOnCalibrationDragMove;
  window.__triageCalibrationDragEnd=triageOnCalibrationDragEnd;
  document.addEventListener('mousemove',window.__triageCalibrationDragMove);
  document.addEventListener('touchmove',window.__triageCalibrationDragMove,{passive:false});
  document.addEventListener('mouseup',window.__triageCalibrationDragEnd);
  document.addEventListener('touchend',window.__triageCalibrationDragEnd);
  if(evt.preventDefault)evt.preventDefault();
}

function triageOnCalibrationDragMove(evt){
  var drag=window.__triageCalibrationDrag;
  if(!drag)return;
  var p=triagePointerXY(evt);
  var dxPct=((p.x-drag.startX)/drag.width)*100;
  var dyPct=((p.y-drag.startY)/drag.height)*100;
  if(Math.abs(p.x-drag.startX)>2||Math.abs(p.y-drag.startY)>2)drag.moved=true;
  var nextX=Math.round((drag.baseX+dxPct)*10)/10;
  var nextY=Math.round((drag.baseY+dyPct)*10)/10;
  setMarkerCalibrationOffsetRuntime(drag.markerId,{x:nextX,y:nextY},false);
  var finalX=drag.anchorX+nextX;
  var finalY=drag.anchorY+nextY;
  drag.el.style.left='calc('+finalX+'% - 12px)';
  drag.el.style.top='calc('+finalY+'% - 12px)';
  if(evt.preventDefault)evt.preventDefault();
}

function triageOnCalibrationDragEnd(){
  var drag=window.__triageCalibrationDrag;
  if(!drag)return;
  var final=markerCalibrationOffset(drag.markerId);
  setMarkerCalibrationOffsetRuntime(drag.markerId,final,true);
  document.removeEventListener('mousemove',window.__triageCalibrationDragMove);
  document.removeEventListener('touchmove',window.__triageCalibrationDragMove);
  document.removeEventListener('mouseup',window.__triageCalibrationDragEnd);
  document.removeEventListener('touchend',window.__triageCalibrationDragEnd);
  window.__triageCalibrationDrag=null;
  if(drag.moved)window.__triageDragSuppressClickUntil=Date.now()+250;
  render();
}

function triageToggleCalibrationMode(mode){
  var t=triageModeState(mode);
  if(!t.calibration||typeof t.calibration!=="object")t.calibration={active:false,markerId:""};
  t.calibration.active=!t.calibration.active;
  if(t.calibration.active&&!t.calibration.markerId){
    var currentView=t.bodyView||"front";
    for(var i=0;i<BODY_MARKERS.length;i++){
      if(BODY_MARKERS[i].view===currentView){
        t.calibration.markerId=BODY_MARKERS[i].id;
        break;
      }
    }
  }
  render();
}

function triageSelectCalibrationMarker(mode,markerId,silent){
  var t=triageModeState(mode);
  if(!t.calibration||typeof t.calibration!=="object")t.calibration={active:true,markerId:""};
  t.calibration.active=true;
  t.calibration.markerId=String(markerId||"");
  if(!silent)render();

function markerMountOffset(markerId,view){
  var id=String(markerId||"");
  var left=id.indexOf("_e")!==-1 || id.indexOf("esquerdo")!==-1;
  var right=id.indexOf("_d")!==-1 || id.indexOf("direito")!==-1;
  var upper=/ombro|braco|cotovelo|antebraco|mao|clavicula/.test(id);
  var lower=/quadril|coxa|joelho|perna|tornozelo|pe/.test(id);
  var x=0;
  var y=0;
  if(upper){
    x=left?1.2:(right?-1.2:0.2);
    y=-0.6;
  }else if(lower){
    x=left?0.8:(right?-0.8:0.1);
    y=-0.4;
  }
  if(view==="back")y+=0.1;
  return {x:x,y:y};
}

function markerAnchorPosition(markerId,view){
  var id=String(markerId||"");
  var mk=markerById(id);
  if(!mk||!Array.isArray(mk.segments)||!mk.segments.length)return null;
  var targetView=view||mk.view;
  var count=0,sumX=0,sumY=0;
  mk.segments.forEach(function(segId){
    var seg=BODY_SEGMENT_BY_ID[segId];
    if(!seg||seg.view!==targetView)return;
    sumX+=Number(seg.x||0)+Number(seg.w||0)/2;
    sumY+=Number(seg.y||0)+Number(seg.h||0)/2;
    count++;
  });
  if(!count)return null;

  var anchor={x:sumX/count,y:sumY/count};
  var fineTune={
    front_costelas_e:{x:8,y:-0.2}, front_costelas_d:{x:-8,y:-0.2},
    back_costelas_e:{x:8,y:-0.2}, back_costelas_d:{x:-8,y:-0.2},

    front_clavicula_e:{x:0.1,y:-0.3}, front_clavicula_d:{x:-0.1,y:-0.3},
    back_clavicula_e:{x:0.1,y:-0.3}, back_clavicula_d:{x:-0.1,y:-0.3},

    front_ombro_e:{x:1.2,y:-0.8}, front_ombro_d:{x:-1.2,y:-0.8},
    back_ombro_e:{x:1.2,y:-0.8}, back_ombro_d:{x:-1.2,y:-0.8},
    front_braco_e:{x:1.8,y:-0.4}, front_braco_d:{x:-1.8,y:-0.4},
    back_braco_e:{x:1.8,y:-0.4}, back_braco_d:{x:-1.8,y:-0.4},
    front_cotovelo_e:{x:2.4,y:-0.2}, front_cotovelo_d:{x:-2.4,y:-0.2},
    back_cotovelo_e:{x:2.4,y:-0.2}, back_cotovelo_d:{x:-2.4,y:-0.2},
    front_antebraco_e:{x:3.2,y:-0.3}, front_antebraco_d:{x:-3.2,y:-0.3},
    back_antebraco_e:{x:3.2,y:-0.3}, back_antebraco_d:{x:-3.2,y:-0.3},
    front_mao_e:{x:4.6,y:-1.1}, front_mao_d:{x:-4.6,y:-1.1},
    back_mao_e:{x:4.6,y:-1.1}, back_mao_d:{x:-4.6,y:-1.1},
    front_mao_palmar_e:{x:6,y:1.8}, front_mao_palmar_d:{x:-6,y:1.8},
    back_mao_palmar_e:{x:6,y:1.8}, back_mao_palmar_d:{x:-6,y:1.8},

    front_quadril_e:{x:0.2,y:-0.2}, front_quadril_d:{x:-0.2,y:-0.2},
    back_quadril_e:{x:0.2,y:-0.2}, back_quadril_d:{x:-0.2,y:-0.2},
    front_coxa_e:{x:0.2,y:0.1}, front_coxa_d:{x:-0.2,y:0.1},
    back_coxa_e:{x:0.2,y:0.1}, back_coxa_d:{x:-0.2,y:0.1},
    front_joelho_e:{x:0.1,y:-0.5}, front_joelho_d:{x:-0.1,y:-0.5},
    back_joelho_e:{x:0.1,y:-0.5}, back_joelho_d:{x:-0.1,y:-0.5},
    front_perna_e:{x:0.1,y:-0.8}, front_perna_d:{x:-0.1,y:-0.8},
    back_perna_e:{x:0.1,y:-0.8}, back_perna_d:{x:-0.1,y:-0.8},
    front_tornozelo_e:{x:0.4,y:-2.8}, front_tornozelo_d:{x:-0.4,y:-2.8},
    back_tornozelo_e:{x:0.4,y:-2.8}, back_tornozelo_d:{x:-0.4,y:-2.8},
    front_pe_e:{x:0.5,y:-5.5}, front_pe_d:{x:-0.5,y:-5.5},
    back_pe_e:{x:0.5,y:-5.5}, back_pe_d:{x:-0.5,y:-5.5}
  };
  var tweak=fineTune[id];
  if(tweak){
    anchor.x+=Number(tweak.x||0);
    anchor.y+=Number(tweak.y||0);
  }
  return anchor;
}

function interconsultaUploadHumanSize(bytes){
  var b=Number(bytes||0);
  if(!isFinite(b)||b<=0)return "0 B";
  if(b<1024)return b+" B";
  if(b<1048576)return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(2)+" MB";
}
function handleInterconsultaExamUpload(mode,input){
  var m=(mode==="tele")?"tele":"pres";
  if(!state.interconsultaDraft[m])state.interconsultaDraft[m]={exameTexto:"",exameLink:"",exameUploads:[]};
  if(!Array.isArray(state.interconsultaDraft[m].exameUploads))state.interconsultaDraft[m].exameUploads=[];
  if(!input||!input.files||!input.files.length)return;
  var files=Array.prototype.slice.call(input.files||[]);
  var maxBytes=12*1024*1024;
  var pending=files.length;
  var added=0;
  var rejected=[];
  function doneOne(){
    pending--;
    if(pending>0)return;
    input.value="";
    if(rejected.length)alert("Alguns arquivos não foram adicionados: "+rejected.join(", "));
    if(added)render();
  }
  files.forEach(function(f){
    if(!f||!f.name){rejected.push("arquivo inválido");doneOne();return}
    if(f.size>maxBytes){rejected.push(f.name+" (maior que 12 MB)");doneOne();return}
    var reader=new FileReader();
    reader.onload=function(){
      state.interconsultaDraft[m].exameUploads.push({
        id:Date.now()+Math.floor(Math.random()*100000),
        name:String(f.name||"arquivo"),
        size:Number(f.size||0),
        type:String(f.type||"application/octet-stream"),
        dataUrl:String(reader.result||""),
        uploadedAt:new Date().toISOString()
      });
      added++;
      doneOne();
    };
    reader.onerror=function(){rejected.push(f.name+" (erro de leitura)");doneOne()};
    reader.readAsDataURL(f);
  });
}
function removeInterconsultaExamUpload(mode,id){

    toggleInterconsultaRec(false);

  }
  s.active=true;
  s.t=0;
  s.tiv=setInterval(function(){s.t++;var el=document.getElementById("seniorSessionTimer");if(el)el.textContent=fmtClockSec(s.t)},1000);
  toggleInterconsultaRec(true);

function toggleInterconsultaRec(forceStart){
  var s=state.interconsulta.session;
  var c=activeInterconsultaCase();
  if(!c||!canAccessInterconsultaCase(c))return;
  var stopNow=(forceStart===false)||(forceStart!==true&&s.rec);
  if(stopNow){
    if(s.ctrl){try{s.ctrl.parar()}catch(e){}}
    s.rec=false;
    c.conversationText=s.liveText||c.conversationText||"";
    c.status=c.summaryText?"respondido":"em_discussao";
    render();
    return;
  }
  if(forceStart===true&&s.rec)return;
  ensureAiNow(function(){
    s.rec=true;
    s.liveText=s.liveText||c.conversationText||"";
    c.status="em_discussao";
    render();
    OrtoguIA.transcricaoAoVivo({
      paciente:{nome:c.patientName||"Paciente",cpf:c.cpf||""},
      onTexto:function(t){
        state.interconsulta.session.liveText=t;
        var ac=activeInterconsultaCase();
        if(ac)ac.conversationText=t;
        render();
      },
      onErro:function(msg){
        if(isRecoverableTranscribeError(msg))return;
        state.interconsulta.session.liveText=(state.interconsulta.session.liveText?state.interconsulta.session.liveText+"\n":"")+"⚠ "+msg;
        state.interconsulta.session.rec=false;
        render();
      }
    }).then(function(ctrl){state.interconsulta.session.ctrl=ctrl});
  },function(){
    s.rec=false;
    s.liveText=(s.liveText?String(s.liveText)+"\n":"")+"⚠ Backend de IA indisponível para transcrição automática da interconsulta.";
    render();
  });
}

function runRetentionNow(){
  var days=Number(state.lgpd.retentionDays)||LGPD_DEFAULT_RETENTION_DAYS;
  if(days<30)days=30;
  state.lgpd.retentionDays=days;
  var cutoff=Date.now()-days*24*60*60*1000;
  var beforePatients=state.patients.length;
  state.patients=state.patients.filter(function(p){
    var ref=Date.parse(p.updatedAt||p.createdAt||new Date().toISOString());
    return isFinite(ref)?ref>=cutoff:true;
  });
  var removedPatients=beforePatients-state.patients.length;
  var logs=readAuditLogs();
  var kept=logs.filter(function(l){
    var at=Date.parse(l.at||"");
    return isFinite(at)?at>=cutoff:true;
  });
  var removedLogs=logs.length-kept.length;
  saveAuditLogs(kept);
  savePatients();
  state.lgpd.expurged=removedPatients+removedLogs;
  state.lgpd.lastPurgeAt=new Date().toISOString();
  auditLog("lgpd_retention_purge",{days:days,removedPatients:removedPatients,removedLogs:removedLogs});
  render();
}
function setRetentionDays(v){

function weekView(){

// distribute patients across weekdays deterministically
var byDay=[[],[],[],[],[],[],[]];
state.patients.forEach(function(pt,i){byDay[(i*2)%5].push(pt)});
var cols="";
for(var d=0;d<7;d++){
  var dd=new Date(startD);dd.setDate(startD.getDate()+d);
  var evs="";byDay[d].forEach(function(pt){var sc=statusCfg(pt.status);evs+='<div class="wkev" style="border-left-color:'+sc.dot+';background:'+sc.bg+'"><div class="t" style="color:'+sc.tx+'">'+pt.hora+'</div><div class="n">'+esc(pt.name.split(" ")[0]+" "+(pt.name.split(" ")[1]||""))+'</div></div>'});
  if(d>4)evs=evs||'<div style="font-size:10px;color:#A2ABAE;text-align:center;padding-top:20px">—</div>';
  cols+='<div class="wkcol"><div class="wh'+(d===todayIdx?" today":"")+'"><div class="wd">'+dias[d]+'</div><div class="wn">'+dd.getDate()+'</div></div><div class="wkbody">'+evs+'</div></div>';
}
return '<div class="weekgrid">'+cols+'</div>';
}
function monthView(){

for(var i=0;i<startDow;i++)cells+='<div class="mcell out"></div>';
for(var day=1;day<=daysInMonth;day++){

function currentDocState(mode,id){

function getDocStores(mode){
  var tele=mode==="tele";
  return {
    textStore:tele?state.teleText:state.pres.docText,
    itemsStore:tele?state.teleDocItems:state.pres.docItems,
    idxStore:tele?state.teleDocIdx:state.pres.docIdx
  };
}
function normalizeAgentOutputs(raw){
  if(Array.isArray(raw)){
    return raw.map(function(x){return String(x||"").trim()}).filter(Boolean);
  }
  var txt=String(raw||"").trim();
  if(!txt)return [];
  try{
    var parsed=JSON.parse(txt);
    if(Array.isArray(parsed)){
      return parsed.map(function(x){return String(x||"").trim()}).filter(Boolean);
    }
  }catch(e){}
  var parts=txt.split(/\n(?:-{3,}|={3,})\n/g).map(function(p){return String(p||"").trim()}).filter(Boolean);
  if(parts.length>1)return parts;
  return [txt];
}
function ensureDocItems(mode,id,fallback){
  var stores=getDocStores(mode);
  var items=stores.itemsStore[id];
  if(!Array.isArray(items)||!items.length){
    items=[String(fallback||"")];
    stores.itemsStore[id]=items;
    stores.idxStore[id]=0;
  }
  return items;
}
function shiftDocItem(mode,id,delta){
  var stores=getDocStores(mode);
  var items=ensureDocItems(mode,id,stores.textStore[id]||"");
  var idx=Number(stores.idxStore[id]||0)+Number(delta||0);
  if(idx<0)idx=0;
  if(idx>items.length-1)idx=items.length-1;
  stores.idxStore[id]=idx;
  stores.textStore[id]=items[idx]||"";
  render();
}

// Gera o documento via GPT a partir da anamnese/transcrição
function gerarDoc(mode,id){
  if(!aiReady()){alert("Backend de IA não conectado. Inicie o servidor (npm start) para gerar com IA.");return}
  var gen=mode==="tele"?state.teleGen:state.pres.docGen;
  var stores=getDocStores(mode);
  var store=stores.textStore;
  gen[id]="loading";render();
  var pt=selectedPatientForMode(mode==="tele"?"teleconsulta":"presencial")||{};
  var paciente={nome:pt.name||"Paciente",cpf:pt.cpf||"",plano:pt.plano||""};
  var anamnese=mode==="tele"?(state.teleTrans.anamData||null):(state.pres.anamData||null);
  var transcricao=mode==="tele"
    ?enrichTranscriptWithTriage(state.teleTrans.liveText||"","tele")
    :enrichTranscriptWithTriage(state.pres.liveText||"","pres");
  var triagem=triageAsObject(mode==="tele"?"tele":"pres");

  function enviarDocumento(anam){
    return OrtoguIA.gerarDocumento(id,{paciente:paciente,anamnese:anam,transcricao:transcricao,triagem:triagem,instrucoes:""})
      .then(function(texto){
        var chunks=normalizeAgentOutputs(texto);
        if(!chunks.length)chunks=[""];
        var formattedItems=chunks.map(function(chunk){return formatMedicalDocument(mode,id,chunk,pt)});
        gen[id]="done";
        stores.itemsStore[id]=formattedItems;
        stores.idxStore[id]=0;
        store[id]=formattedItems[0]||"";
        if(pt&&pt.id){
          var docLabel=(DOCS.filter(function(d){return d.id===id})[0]||{l:"Documento"}).l;
          formattedItems.forEach(function(content,idx){
            var suffix=formattedItems.length>1?" #"+(idx+1):"";
            saveDocumentToCloud(
              pt,
              mode==="tele"?"teleconsulta":"presencial",
              id,
              docLabel+suffix,
              content,
              {anamnese:!!anam,responseIndex:idx+1,responseCount:formattedItems.length,triagem:triageSummaryText(mode==="tele"?"tele":"pres")}
            );
          });
        }
        render();
      })
      .catch(function(e){gen[id]="done";alert("Falha ao gerar: "+e.message);render()});
  }

  // Em teleconsulta, tenta sempre estruturar a transcrição antes do documento.
  if(mode==="tele" && transcricao && !anamnese){
    OrtoguIA.gerarAnamnese({paciente:paciente,transcricao:transcricao,triagem:triagem})
      .then(function(data){state.teleTrans.anamData=data;state.teleTrans.anam=true;return enviarDocumento(data)})
      .catch(function(){state.teleTrans.anam=true;return enviarDocumento(null)});
    return;
  }

  enviarDocumento(anamnese);
}

var anam='<div class="empty">Gerada após a transcrição</div>';

else if(p.anam){

    anam="";map.forEach(function(a){if(a[1]){anam+='<div class="sec"><div class="t">'+a[0]+'</div><div class="v">'+esc(a[1])+'</div></div>'}});

var presCtrl='<div class="sessionbar"><div class="left"><button class="sessionbtn '+(p.active?"live":"")+'" onclick="togglePresSession()">'+svg(p.active?"stop":"rec","ico-sm")+(p.active?"Parar":"Iniciar")+'</button><div class="timerpill"><span class="dot" style="'+(p.active?"animation:pulse 1s infinite":"background:#A2ABAE")+'"></span><span id="presSessionTimer">'+fmtClockSec(p.t)+'</span></div></div><div class="hint">Iniciar controla a transcrição da consulta presencial</div></div>';

}
function toggleRec(forceStart){
  var p=state.pres;
  // PARAR
  var stopNow=(forceStart===false)||(forceStart!==true&&p.rec);
  if(stopNow){
    if(p.ctrl){try{p.ctrl.parar()}catch(e){}}
    if(p.iv){clearInterval(p.iv);p.iv=null}
    p.rec=false;
    render();
    // ao parar, gera a anamnese a partir do texto capturado
    gerarAnamnesePres();
    return;
  }
  if(forceStart===true&&p.rec)return;
  ensureAiNow(function(){
    // INICIAR
    p.rec=true;p.lines=[];p.idx=0;p.anam=false;p.anamData=null;p.liveText="";
    render();
    var pt=selectedPatientForMode("presencial")||{};

    // TRANSCRIÇÃO REAL (microfone -> Whisper via WebSocket)
    OrtoguIA.transcricaoAoVivo({
      paciente:{nome:pt.name||"Paciente",cpf:pt.cpf||""},
      onTexto:function(textoCompleto){
        state.pres.liveText=textoCompleto;
        state.pres.lines=[{sp:"Transcrição",tx:textoCompleto}];
        render();
        var sc=document.getElementById("transcript");if(sc)sc.scrollTop=sc.scrollHeight;
      },
      onErro:function(msg){
        if(isRecoverableTranscribeError(msg)){
          state.pres.lines=[{sp:"Sistema",tx:"⚠ Trecho de áudio inválido ignorado; transcrição continua."}];
          render();
          return;
        }
        state.pres.lines=[{sp:"Sistema",tx:"⚠ "+msg}];
        state.pres.rec=false;
        if(state.pres.ctrl){try{state.pres.ctrl.parar()}catch(e){}}
        render();
      }
    }).then(function(ctrl){ state.pres.ctrl=ctrl; });
  },function(){
    state.pres.lines=[{sp:"Sistema",tx:"⚠ Backend de IA indisponível. A consulta presencial exige conexão com o servidor."}];
    state.pres.rec=false;
    render();
  });
}

// Fallback: transcrição simulada (quando o backend está offline)
function demoTranscript(){
  var p=state.pres;p.idx=0;p.lines=[];
  p.iv=setInterval(function(){
    if(p.idx<TRANSCRIPT.length){
      p.lines.push(TRANSCRIPT[p.idx++]);render();
      var sc=document.getElementById("transcript");if(sc)sc.scrollTop=sc.scrollHeight;
    }else{
      clearInterval(p.iv);p.iv=null;p.rec=false;
      p.liveText=TRANSCRIPT.map(function(l){return l.sp+": "+l.tx}).join(" ");
      render();gerarAnamnesePres();
    }
  },1500);
}

// Gera a anamnese estruturada a partir da transcrição
function gerarAnamnesePres(){
  var p=state.pres;
  var texto=enrichTranscriptWithTriage(presTranscriptText(),"pres");
  if(!texto){p.anam=true;p.anamData=null;render();return}
  p.anam="loading";render();
  var pt=selectedPatientForMode("presencial")||{};
  ensureAiNow(function(){
    OrtoguIA.gerarAnamnese({paciente:{nome:pt.name||"Paciente",cpf:pt.cpf||""},transcricao:texto,triagem:triageAsObject("pres")})
      .then(function(data){state.pres.anamData=data;state.pres.anam=true;if(pt&&pt.id){saveDocumentToCloud(pt,"presencial","anamnese","Anamnese estruturada",JSON.stringify(data,null,2),{from:"presencial"})}render()})
      .catch(function(){state.pres.anam=true;state.pres.anamData=null;render()});
  },function(){
    state.pres.anam=true;
    state.pres.anamData=null;
    render();
  });
}

ss="submit" onclick="submitForm()">'+(sec?"Salvar Cadastro":"Confirmar Agendamento e Enviar WhatsApp")+'</button></div></div>';

function setForm(k,v){state.form[k]=v}
function submitForm(){
  var f=state.form;
  if(!f.nome||!f.cpf){alert("Preencha nome e CPF");return}
  var nextId=state.patients.reduce(function(m,p){return Math.max(m,Number(p.id)||0)},0)+1;
  state.patients.push(normalizePatient({
    id:nextId,
    name:f.nome,
    cpf:f.cpf,
    plano:f.plano||"Não informado",
    queixa:f.queixa||"Não informada",
    tipo:f.tipo,
    status:"aguardando",
    hora:f.hora||"08:00",
    esp:f.esp,
    data:f.data||todayIso(),
    aniversario:"",
    medicacao:"",
    consultasPrevias:0
  }));
  savePatients();
  auditLog("patient_register_or_schedule",{patientId:nextId,tipo:f.tipo,esp:f.esp});
  f.ok=true;
  render();
  setTimeout(function(){state.form={nome:"",cpf:"",plano:"",queixa:"",tipo:"presencial",esp:"Clínica Geral",data:"",hora:"",ok:false};render()},3000)
}
function viewLembretes(){
  var hoje=new Date();
  var mm=pad2(hoje.getMonth()+1);
  var dd=pad2(hoje.getDate());
  var alerta=[];
  var aniversarios=[];
  var meds=[];
  state.patients.forEach(function(p){
    var q=(p.queixa||"").toLowerCase();
    if(q.indexOf("febre")!==-1||q.indexOf("ferimentos extensos")!==-1||q.indexOf("piora")!==-1||(p.consultasPrevias||0)>2){
      alerta.push('<div class="line"><div class="av pa">AL</div><div class="bub"><div class="sp">'+esc(p.name)+'</div><div class="tx">'+esc(p.queixa)+' · '+((p.consultasPrevias||0)>2?"Mais que duas consultas":"Sinal de alerta")+'</div></div></div>');
    }
    if((p.aniversario||"").slice(5)===mm+"-"+dd){
      aniversarios.push('<div class="line"><div class="av pa">AN</div><div class="bub"><div class="sp">'+esc(p.name)+'</div><div class="tx">Aniversário hoje · '+esc(p.aniversario)+'</div></div></div>');
    }

      meds.push('<div class="line"><div class="av pa">MD</div><div class="bub"><div class="sp">'+esc(p.name)+'</div><div class="tx">'+esc(p.medicacao)+'</div></div></div>');
    }

  var anivBlock=aniversarios.length?aniversarios.join(""):'<div class="empty" style="padding-top:26px">Sem aniversários hoje.</div>';
  var medBlock=meds.length?meds.join(""):'<div class="empty" style="padding-top:26px">Sem lembretes de medicação.</div>';

function render(){
  if(!requireValidSession())return;
  if(!canAccessTab(state.tab)){auditLog("tab_access_denied",{tab:state.tab},"denied");state.tab=navForRole()[0].id}
  syncProfileUI();
  renderNav();
  var v=document.getElementById("view");
  if(state.tab==="agenda")v.innerHTML=viewAgenda();
  else if(state.tab==="teleconsulta")v.innerHTML=viewTele();
  else if(state.tab==="presencial")v.innerHTML=viewPres();
  else if(state.tab==="interconsulta")v.innerHTML=viewInterconsulta();
  else if(state.tab==="agendamento")v.innerHTML=viewAgend();
  else if(state.tab==="assistentes")v.innerHTML=viewAssistentes();
  else if(state.tab==="lembretes")v.innerHTML=viewLembretes();
  else if(state.tab==="relatorios")v.innerHTML=viewRel();
  else if(state.tab==="lgpd")v.innerHTML=viewLgpd();
}
if(requireValidSession()){
  runRetentionNow();
  auditLog("session_open",{tab:state.tab});
  render();
}
</script>
<!-- Conexão com o backend de agentes de IA (transcrição + documentos) -->
<script src="ortoguia-agents.js"></script>
<script>
  // Configuração automática por ambiente.
  // Localhost -> backend local; produção -> tenta subdomínio API e cai para mesmo host.
  (function () {
    var session={};
    try{session=JSON.parse(localStorage.getItem("ortopguia:session")||"{}")||{}}catch(e){session={}}
    var isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";
    var candidates = isLocal
      ? ["http://localhost:8787"]
      : ["https://api.ortopguia.com.br"];

    function tryCandidate(i) {
      if (i >= candidates.length) {
        window.__ORTO_AI_READY = false;
        return;
      }

      OrtoguIA.config({ baseUrl: candidates[i], authToken: session.accessToken || "" });
      OrtoguIA.ping(2500)
        .then(function (ok) {
          if (ok) {
            window.__ORTO_AI_READY = true;
            return;
          }
          tryCandidate(i + 1);
        })
        .catch(function () {
          tryCandidate(i + 1);
        });
    }

    // Ativa IA real somente quando o backend estiver acessível.
    tryCandidate(0);
  })();
</script>
