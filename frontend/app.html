<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ORTOPGUIA — Saúde Digital | ortoguia.com.br</title>
<link rel="icon" type="image/svg+xml" href="favicon-ortoguia.svg">

<meta name="description" content="ORTOPGUIA — atendimento ortopédico inicial guiado por inteligência artificial. Teleconsulta e consulta presencial. ortoguia.com.br">
<link rel="canonical" href="https://ortoguia.com.br/">
<meta property="og:title" content="ORTOPGUIA — Saúde Digital">
<meta property="og:description" content="Atendimento ortopédico inicial guiado por inteligência artificial.">
<meta property="og:url" content="https://ortoguia.com.br/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#FCFDFE;font-family:'Inter','Segoe UI',-apple-system,sans-serif;color:#33393B;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:#1E4E58!important}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:#D5DFE3;border-radius:3px}
  button:active{opacity:.85}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  svg{display:block}
  .ico{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ico-sm{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ico-lg{width:34px;height:34px;stroke:currentColor;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .app{display:flex;min-height:100vh;background:#FCFDFE}

  .logo{display:flex;align-items:center;gap:11px}
  .logo .ic{width:38px;height:38px;border-radius:11px;background:#1E4E58;display:flex;align-items:center;justify-content:center}
  .logo .ic svg{width:21px;height:21px;stroke:#fff;stroke-width:1.5;fill:none}
  .logo .nm{font-family:'Sora',sans-serif;font-weight:600;font-size:18px;letter-spacing:-.4px;line-height:1.05}
  .logo .nm .orto{color:#1E4E58}
  .logo .nm .gu{color:#33393B}
  .logo .nm .ia{color:#C99746;font-weight:700}
  .logo .nm .ia .i-dot{position:relative;display:inline-block}
  .logo .nm .ia .i-dot:after{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-.18em;width:.2em;height:.2em;border-radius:50%;background:currentColor}
  .logo .sb{color:#A2ABAE;font-size:8.5px;letter-spacing:2px;text-transform:uppercase;margin-top:3px}

  .sidebar{width:226px;flex-shrink:0;min-height:100vh;background:#F4F8FA;border-right:1px solid #E6EDF0;display:flex;flex-direction:column}
  .sb-head{padding:24px 20px 20px;border-bottom:1px solid #E6EDF0}
  .sb-tag{color:#A2ABAE;font-size:10.5px;line-height:1.55;margin-top:14px}
  .sb-nav{padding:14px 12px;flex:1}
  .sb-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:10px;border:none;margin-bottom:4px;background:transparent;color:#566066;font-size:13px;text-align:left;transition:all .15s}
  .sb-nav button:hover{background:rgba(30,78,88,.05)}
  .sb-nav button.on{background:#FFFFFF;color:#13404A;font-weight:600;box-shadow:0 1px 5px rgba(19,64,74,.1)}
  .sb-nav button .ico{color:#A2ABAE}
  .sb-nav button.on .ico{color:#1E4E58}
  .sb-foot{padding:14px 18px;border-top:1px solid #E6EDF0;display:flex;align-items:center;gap:10px}
  .sb-foot .av{width:34px;height:34px;border-radius:50%;background:#1E4E58;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .sb-foot .dn{color:#33393B;font-size:12px;font-weight:600}
  .sb-foot .dr{color:#A2ABAE;font-size:10px}

  .mhead{display:none;position:fixed;top:0;left:0;right:0;z-index:100;background:#FFFFFF;border-bottom:1px solid #E6EDF0;padding:11px 16px;align-items:center;box-shadow:0 1px 8px rgba(19,64,74,.04)}
  .mhead .onl{margin-left:auto;display:flex;align-items:center;gap:6px}
  .mhead .onl .d{width:7px;height:7px;border-radius:50%;background:#2E9E5B}
  .mhead .onl span{font-size:10px;color:#697275}
  .bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:#FFFFFF;border-top:1px solid #E6EDF0;box-shadow:0 -1px 10px rgba(19,64,74,.04)}
  .bnav button{flex:1;padding:8px 4px 6px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;color:#A2ABAE}
  .bnav button.on{border-top-color:#C99746;color:#1E4E58}
  .bnav button .l{font-size:9px}
  .bnav button.on .l{font-weight:600}

  .main{flex:1;padding:28px 34px;overflow-y:auto;max-height:100vh;background:#FCFDFE}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
  .pill{padding:6px 13px;background:#FFFFFF;border:1px solid #E6EDF0;border-radius:20px;font-size:11px;color:#697275;display:flex;align-items:center;gap:6px}
  .pill svg{color:#1E4E58}
  .h2{font-family:'Sora',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.6px;color:#13404A}
  .sub{color:#697275;font-size:12px;margin-top:5px}
  .card{background:#FFFFFF;border-radius:12px;border:1px solid #E6EDF0;box-shadow:0 1px 3px rgba(19,64,74,.03)}
  .legend{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .legend .it{display:flex;align-items:center;gap:6px;font-size:11px;color:#697275}
  .legend .dot{width:9px;height:9px;border-radius:50%}

  /* view tabs */
  .vtabs{display:inline-flex;background:#EEF3F5;border:1px solid #E6EDF0;border-radius:10px;padding:3px;gap:2px;margin:16px 0 4px}
  .vtabs button{padding:7px 16px;border:none;background:transparent;border-radius:8px;font-size:12px;font-weight:600;color:#697275;font-family:'Inter'}
  .vtabs button.on{background:#FFFFFF;color:#13404A;box-shadow:0 1px 4px rgba(19,64,74,.1)}

  /* AGENDA timeline */
  .agwrap{display:flex;align-items:flex-start}
  .timeline{width:66px;flex-shrink:0;background:#F4F8FA;border:1px solid #E6EDF0;border-radius:12px;padding:6px 0;position:relative;margin-right:14px}
  .tl-row{height:74px;position:relative;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
  .tl-row .hr{font-size:11px;color:#13404A;font-family:'Sora',monospace;font-weight:600;margin-right:14px}
  .tl-row .dot{position:absolute;right:12px;width:14px;height:14px;border-radius:50%;border:3px solid #F4F8FA;z-index:3}
  .tl-vline{position:absolute;right:18px;top:30px;bottom:30px;width:2px;background:#CBD8DD;z-index:1}
  .tl-now{position:absolute;left:6px;right:6px;height:2px;background:#1E4E58;z-index:6}
  .tl-now .nd{position:absolute;right:12px;top:50%;transform:translate(50%,-50%);width:10px;height:10px;border-radius:50%;background:#1E4E58;border:2px solid #fff}
  .tl-now .nl{position:absolute;left:4px;top:-9px;background:#1E4E58;color:#fff;border-radius:4px;padding:1px 5px;font-size:9px;font-family:'Sora',monospace;font-weight:600;white-space:nowrap}

  .ptlist{flex:1;display:flex;flex-direction:column}
  .ptrow{height:74px;display:flex;align-items:center;padding-bottom:10px}
  .ptcard{background:#FFFFFF;border-radius:12px;padding:0 16px;border:1px solid #E6EDF0;box-shadow:0 1px 3px rgba(19,64,74,.03);display:flex;align-items:center;gap:13px;flex:1;height:64px}
  .ptcard.clickable{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
  .ptcard.clickable:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(19,64,74,.08)}
  .ptcard .tipo{width:34px;height:34px;border-radius:9px;background:#F2F6F8;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#1E4E58}
  .ptcard .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptcard .q{font-size:11px;color:#697275;margin-top:2px}
  .ptcard .meta{font-size:10px;color:#A2ABAE;margin-top:2px}
  .badge{padding:4px 11px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
  .selst{font-size:11px;border:1px solid #E6EDF0;border-radius:8px;padding:6px 9px;color:#697275;background:#FFFFFF;max-width:150px}
  .mtime{text-align:center;min-width:42px;display:none}
  .mtime .d{width:9px;height:9px;border-radius:50%;margin:0 auto 4px}
  .mtime .t{font-size:11px;font-weight:600;color:#1E4E58;font-family:'Sora',monospace}

  .row{display:flex;gap:14px;margin-bottom:14px}
  .video{flex:1;border-radius:16px;background:linear-gradient(160deg,#2C6470,#1E4E58);min-height:340px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .video .ph{text-align:center;color:rgba(255,255,255,.55)}
  .video .ph svg{margin:0 auto;stroke:rgba(255,255,255,.5)}
  .video .ph .t{font-size:13px;margin-top:10px;color:rgba(255,255,255,.6)}
  .video .tmr{position:absolute;top:13px;left:13px;background:rgba(0,0,0,.3);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-family:'Sora',monospace;display:flex;align-items:center;gap:6px}
  .video .tmr .d{width:6px;height:6px;border-radius:50%;background:#C99746;animation:pulse 1s infinite}
  .video .pip{position:absolute;bottom:13px;right:13px;width:92px;height:70px;background:rgba(255,255,255,.12);border-radius:11px;border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
  .panel{display:flex;flex-direction:column;gap:12px;width:212px}
  .pblk{background:#FFFFFF;border-radius:12px;padding:15px;border:1px solid #E6EDF0;box-shadow:0 1px 3px rgba(19,64,74,.03)}
  .ptt{font-size:10px;color:#A2ABAE;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:12px}
  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ctrls button{padding:11px 6px;border-radius:10px;border:1px solid #E6EDF0;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;gap:5px;color:#697275}
  .ctrls button.on{border-color:#6FA08C;background:#EDF4F1;color:#558776}
  .ctrls button.off{border-color:#D8504E;background:#FBE9E8;color:#D8504E}
  .ctrls button .l{font-size:9px;font-weight:600}
  .info .kv{margin-bottom:10px}
  .info .k{font-size:9px;color:#A2ABAE;text-transform:uppercase;letter-spacing:.8px}
  .info .v{font-size:12px;font-weight:500;margin-top:1px}
  .callbtn{padding:13px;border-radius:11px;border:none;font-weight:600;font-size:13px;background:#1E4E58;color:#fff;font-family:'Sora';display:flex;align-items:center;justify-content:center;gap:8px}
  .callbtn.live{background:#D8504E}
  .whats{background:#EDF4F1;border:1px solid #CFE0D8;border-radius:12px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
  .whats .wc{color:#558776;flex-shrink:0;margin-top:1px}
  .whats .t{font-size:12px;font-weight:600;color:#558776}
  .whats .s{font-size:11px;color:#5C7A6C;margin-top:2px}

  .sessionbar{margin-top:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid #E6EDF0;border-radius:12px;background:#FFFFFF}
  .sessionbar .left{display:flex;align-items:center;gap:9px}
  .sessionbar .hint{font-size:11px;color:#697275}
  .sessionbtn{padding:10px 16px;border:none;border-radius:10px;background:#1E4E58;color:#fff;font-size:12px;font-weight:600;font-family:'Sora';display:flex;align-items:center;gap:6px}
  .sessionbtn.live{background:#D8504E}
  .timerpill{padding:7px 11px;border:1px solid #E6EDF0;border-radius:999px;background:#F4F8FA;color:#13404A;font-size:12px;font-family:'Sora',monospace;display:flex;align-items:center;gap:6px}
  .timerpill .dot{width:7px;height:7px;border-radius:50%;background:#2E9E5B}
  .consult-head{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .headbtn{padding:8px 12px;border:1px solid #E6EDF0;border-radius:9px;background:#FFFFFF;color:#566066;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px}
  .headbtn.primary{background:#1E4E58;border-color:#1E4E58;color:#fff}
  .headbtn.primary svg{stroke:#fff}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .ahead{padding:14px 15px;border-bottom:1px solid #E6EDF0;display:flex;align-items:center;justify-content:space-between}
  .ahead .tt{font-size:12px;font-weight:600;color:#13404A;display:flex;align-items:center;gap:7px}
  .ahead .ds{font-size:10px;color:#A2ABAE;margin-top:3px}
  .recbtn{padding:8px 14px;border-radius:9px;border:none;font-weight:600;font-size:11px;background:#1E4E58;color:#fff;font-family:'Sora';display:flex;align-items:center;gap:6px}
  .recbtn.rec{background:#D8504E}
  .recbtn svg{stroke:#fff}
  .scroll{height:224px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .empty{text-align:center;color:#A2ABAE;padding-top:64px;font-size:12px}
  .line{display:flex;gap:9px}
  .line .av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
  .line .av.dr{background:#1E4E58;color:#fff}
  .line .av.pa{background:#F2F6F8;color:#697275}
  .line .bub{background:#F2F6F8;border-radius:3px 11px 11px 11px;padding:8px 12px;flex:1}
  .line .sp{font-size:9px;color:#A2ABAE;font-weight:600;margin-bottom:2px}
  .line .tx{font-size:12px;line-height:1.5}
  .typing{display:flex;gap:4px;padding-left:37px}
  .typing .d{width:6px;height:6px;border-radius:50%;background:#6FA08C;opacity:.6;animation:bounce 1s infinite}
  .anam .sec{border-left:2px solid #C99746;padding-left:12px;margin-bottom:13px}
  .anam .sec .t{font-size:9px;color:#B07F34;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
  .anam .sec .v{font-size:12px;margin-top:3px;line-height:1.5}
  .docbtns{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .docbtns button{padding:9px 14px;border-radius:9px;border:1px solid #E6EDF0;background:#FFFFFF;font-size:12px;color:#697275;display:flex;align-items:center;gap:7px}
  .docbtns button svg{color:#A2ABAE}
  .docbtns button.on{border-color:#1E4E58;background:#EDF4F1;color:#1E4E58;font-weight:600}
  .docbtns button.on svg{color:#1E4E58}
  .docarea textarea{width:100%;min-height:96px;padding:12px 14px;border:1px solid #E6EDF0;border-radius:10px;font-size:12px;line-height:1.6;resize:vertical;background:#F2F6F8;color:#33393B;font-family:'Inter'}
  .docactions{display:flex;gap:9px;margin-top:11px;justify-content:flex-end;flex-wrap:wrap}
  .docactions button{padding:9px 16px;border-radius:9px;font-size:12px;display:flex;align-items:center;gap:6px;font-weight:600}
  .docactions .pr{border:1px solid #E6EDF0;background:#FFFFFF;color:#697275}
  .docactions .gen{border:none;background:#C99746;color:#fff;font-family:'Sora'}
  .docactions .gen svg{stroke:#fff}
  .docactions .gen:disabled{opacity:.6;cursor:default}
  .docactions .wa{border:none;background:#2E9E5B;color:#fff;font-family:'Sora'}
  .docactions .wa svg{stroke:#fff}
  .docactions .em{border:none;background:#1E4E58;color:#fff;font-family:'Sora'}
  .docactions .em svg{stroke:#fff}
  .surgnote{font-size:11px;color:#B07F34;margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:6px}

  .form{display:flex;flex-direction:column;gap:15px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .lbl{font-size:10px;color:#697275;font-weight:600;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
  .inp{width:100%;padding:11px 13px;border:1px solid #E6EDF0;border-radius:10px;font-size:13px;color:#33393B;background:#FFFFFF}
  .note{margin-top:18px;padding:13px 15px;background:#EDF4F1;border-radius:10px;border:1px solid #CFE0D8;display:flex;gap:11px;align-items:flex-start;font-size:11px;color:#5C7A6C;line-height:1.6}
  .note svg{color:#558776;flex-shrink:0;margin-top:1px}
  .submit{margin-top:16px;width:100%;padding:14px;border-radius:11px;border:none;font-weight:600;font-size:13px;background:#1E4E58;color:#fff;font-family:'Sora'}
  .okmsg{background:#EDF4F1;border:1px solid #CFE0D8;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;gap:11px;align-items:center}
  .okmsg svg{color:#558776}
  .okmsg .t{font-weight:600;color:#558776;font-size:13px}
  .okmsg .s{font-size:11px;color:#5C7A6C;margin-top:1px}

  .rebook{margin-top:14px}
  .rebook .head{padding:14px 15px;border-bottom:1px solid #E6EDF0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .rebook .head .tt{font-size:12px;font-weight:600;color:#13404A;display:flex;align-items:center;gap:7px}
  .rebook .head .ds{font-size:10px;color:#A2ABAE;margin-top:3px}
  .rebook .body{padding:14px 15px}
  .rebook .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rebook .hint{font-size:11px;color:#697275;margin-top:10px}
  .rebook .cta{margin-top:12px;display:flex;justify-content:flex-end}
  .rebook .cta button{padding:10px 14px;border:none;border-radius:10px;background:#1E4E58;color:#fff;font-size:12px;font-weight:600;font-family:'Sora';display:flex;align-items:center;gap:6px}
  .rebook .cta button:disabled{opacity:.6;cursor:default}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#FFFFFF;border-radius:12px;padding:18px 16px;border:1px solid #E6EDF0;box-shadow:0 1px 3px rgba(19,64,74,.03);border-top:2px solid #1E4E58}
  .stat .si{width:36px;height:36px;border-radius:10px;background:#F2F6F8;display:flex;align-items:center;justify-content:center;margin-bottom:11px;color:#1E4E58}
  .stat .v{font-family:'Sora',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.5px;color:#13404A}
  .stat .l{font-size:11px;color:#697275;font-weight:600;margin-top:4px}
  .stat .s{font-size:10px;color:#A2ABAE;margin-top:2px}
  .bars .b{margin-bottom:12px}
  .bars .bt{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:#697275}
  .bars .bt .v{font-weight:600;color:#33393B}
  .bars .track{height:7px;background:#F2F6F8;border-radius:7px}
  .bars .fill{height:100%;border-radius:7px}

  /* week / month grids */
  .weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px}
  .wkcol{background:#FFFFFF;border:1px solid #E6EDF0;border-radius:12px;overflow:hidden;min-height:240px}
  .wkcol .wh{padding:10px 8px;text-align:center;border-bottom:1px solid #E6EDF0;background:#F4F8FA}
  .wkcol .wh .wd{font-size:10px;color:#A2ABAE;text-transform:uppercase;letter-spacing:.6px}
  .wkcol .wh .wn{font-family:'Sora';font-size:16px;font-weight:700;color:#13404A;margin-top:2px}
  .wkcol .wh.today .wn{color:#fff;background:#1E4E58;border-radius:8px;width:30px;height:30px;line-height:30px;margin:2px auto 0}
  .wkbody{padding:7px 6px;display:flex;flex-direction:column;gap:5px}
  .wkev{border-radius:7px;padding:5px 7px;font-size:10px;line-height:1.3;border-left:3px solid #ccc}
  .wkev .t{font-weight:700;font-family:'Sora'}
  .wkev .n{color:#697275;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

var LGPD_DEFAULT_RETENTION_DAYS=365;

function canAccessTab(tab){
  var s=getSession()||{};
  var role=s.role||"paciente";
  return (ROLE_ALLOWED_TABS[role]||[]).indexOf(tab)!==-1;
}
function normalizePatient(p){
  var c=Object.assign({},p||{});
  if(!c.createdAt)c.createdAt=new Date().toISOString();
  if(!c.updatedAt)c.updatedAt=c.createdAt;
  if(!c.retentionUntil)c.retentionUntil=new Date(Date.parse(c.updatedAt)+LGPD_DEFAULT_RETENTION_DAYS*24*60*60*1000).toISOString();
  return c;
}
function loadPatients(){
  try{
    var raw=localStorage.getItem(PATIENT_STORAGE_KEY);
    if(raw){
      var arr=JSON.parse(raw);
      if(Array.isArray(arr)&&arr.length)return arr.map(normalizePatient);
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(PATIENTS)).map(normalizePatient);
}
function savePatients(){
  try{localStorage.setItem(PATIENT_STORAGE_KEY,JSON.stringify(state.patients.map(normalizePatient)))}catch(e){}
}
function touchPatient(pt){
  if(!pt)return;
  pt.updatedAt=new Date().toISOString();
  pt.retentionUntil=new Date(Date.parse(pt.updatedAt)+LGPD_DEFAULT_RETENTION_DAYS*24*60*60*1000).toISOString();
}
function getSession(){
  try{return JSON.parse(localStorage.getItem("ortopguia:session")||"null")}catch(e){return null}
}
function sessionIsValid(s){
  if(!s||!s.email||!s.role)return false;
  if(!s.lgpdAccepted)return false;
  if(!s.expiresAt)return false;
  if((s.role==="medico"||s.role==="secretaria")&&!s.accessToken)return false;
  var exp=Date.parse(s.expiresAt);
  if(!isFinite(exp))return false;
  return Date.now()<exp;
}
function requireValidSession(){
  var s=getSession();
  if(!sessionIsValid(s)){
    try{localStorage.removeItem("ortopguia:session")}catch(e){}
    window.location.href="index.html";
    return false;
  }
  return true;
}
function auditLog(action,meta,outcome){
  try{
    var s=getSession()||{};
    var arr=JSON.parse(localStorage.getItem("ortopguia:audit")||"[]");
    var nowIso=new Date().toISOString();
    arr.push({
      at:nowIso,
      email:s.email||"",
      role:s.role||"",
      sessionId:s.sid||"",
      tab:state&&state.tab?state.tab:"",
      action:action,
      outcome:outcome||"ok",
      meta:meta||{},
      retentionUntil:new Date(Date.parse(nowIso)+LGPD_DEFAULT_RETENTION_DAYS*24*60*60*1000).toISOString()
    });
    if(arr.length>1000)arr=arr.slice(arr.length-1000);
    localStorage.setItem("ortopguia:audit",JSON.stringify(arr));
  }catch(e){}
}

  var s=getSession();

function selectedPatientForMode(mode){
  var pid=state.activePatientId;
  var fallback=state.patients.filter(function(p){return p.tipo===mode})[0]||state.patients[0]||null;
  if(!pid)return fallback;
  var chosen=getPatientById(pid);
  if(chosen&&chosen.tipo===mode)return chosen;
  return fallback;
}

function allTimeSlots(){
  var out=[];
  for(var h=8;h<=18;h++){
    out.push(pad2(h)+":00");
    if(h<18)out.push(pad2(h)+":30");
  }
  return out;
}
function getFreeSlots(dateIso,excludePatientId){
  var occ={};
  state.patients.forEach(function(pt){
    if(pt.id!==excludePatientId && getPatientDate(pt)===dateIso && pt.hora){occ[pt.hora]=true}
  });
  return allTimeSlots().filter(function(h){return !occ[h]});
}
function getPatientById(id){return state.patients.filter(function(p){return p.id===id})[0]||null}
function modePatientId(mode){
  var m=mode==="tele"?"teleconsulta":"presencial";
  var pt=selectedPatientForMode(m);
  return pt?pt.id:null;
}
function ensureRebookTime(mode){
  var pid=modePatientId(mode);
  var rb=state.rebook[mode];
  var free=getFreeSlots(rb.date,pid);
  if(free.indexOf(rb.time)===-1){rb.time=free[0]||""}
}
function setRebookDate(mode,v){state.rebook[mode].date=v;ensureRebookTime(mode);render()}
function setRebookTime(mode,v){state.rebook[mode].time=v}
function saveRebook(mode){
  if(roleIsSecretaria()){denyAction("rebook_denied_secretaria");return}
  var pid=modePatientId(mode);
  var rb=state.rebook[mode];
  var pt=getPatientById(pid);
  if(!pt||!rb.date||!rb.time)return;
  var free=getFreeSlots(rb.date,pid);
  if(free.indexOf(rb.time)===-1){alert("Horário indisponível. Escolha um horário livre.");ensureRebookTime(mode);render();return}
  pt.data=rb.date;
  pt.hora=rb.time;
  touchPatient(pt);
  savePatients();
  auditLog("rebook_consultation",{mode:mode,patientId:pid,newDate:rb.date,newTime:rb.time});
  alert("Reagendamento realizado para "+fmtDateBR(rb.date)+" às "+rb.time+".");
  render();
}
function rebookWidget(mode){
  var pid=modePatientId(mode);
  var pt=getPatientById(pid);
  var rb=state.rebook[mode];
  var free=getFreeSlots(rb.date,pid);
  var opts=free.map(function(h){return '<option value="'+h+'"'+(rb.time===h?" selected":"")+'>'+h+'</option>'}).join("");
  if(!opts)opts='<option value="">Sem horários livres</option>';
  return '<div class="card rebook"><div class="head"><div><div class="tt">'+svg("agenda","ico-sm")+'Reagendamento</div><div class="ds">Sem conflito com a agenda principal</div></div></div><div class="body"><div class="grid"><div><label class="lbl">Dia / Mês</label><input class="inp" type="date" value="'+rb.date+'" oninput="setRebookDate(\''+mode+'\',this.value)"></div><div><label class="lbl">Horários Livres</label><select class="inp" onchange="setRebookTime(\''+mode+'\',this.value)">'+opts+'</select></div></div><div class="hint">Paciente: '+esc(pt?pt.name:"")+' · '+free.length+' horário(s) livre(s) em '+fmtDateBR(rb.date)+'.</div><div class="cta"><button onclick="saveRebook(\''+mode+'\')"'+(free.length?"":" disabled")+'>'+svg("check","ico-sm")+'Confirmar Reagendamento</button></div></div></div>';
}

function runRetentionNow(){
  var days=Number(state.lgpd.retentionDays)||LGPD_DEFAULT_RETENTION_DAYS;
  if(days<30)days=30;
  state.lgpd.retentionDays=days;
  var cutoff=Date.now()-days*24*60*60*1000;
  var beforePatients=state.patients.length;
  state.patients=state.patients.filter(function(p){
    var ref=Date.parse(p.updatedAt||p.createdAt||new Date().toISOString());
    return isFinite(ref)?ref>=cutoff:true;
  });
  var removedPatients=beforePatients-state.patients.length;
  var logs=readAuditLogs();
  var kept=logs.filter(function(l){
    var at=Date.parse(l.at||"");
    return isFinite(at)?at>=cutoff:true;
  });
  var removedLogs=logs.length-kept.length;
  saveAuditLogs(kept);
  savePatients();
  state.lgpd.expurged=removedPatients+removedLogs;
  state.lgpd.lastPurgeAt=new Date().toISOString();
  auditLog("lgpd_retention_purge",{days:days,removedPatients:removedPatients,removedLogs:removedLogs});
  render();
}

function monthView(){

var cells="";
for(var i=0;i<startDow;i++)cells+='<div class="mcell out"></div>';

  var isToday=day===now.getDate();
  // simulate consultations on weekdays
  var dow=(startDow+day-1)%7;
  var dots="";var cnt=0;
  if(dow<5){var statuses=["aguardando","em_atendimento","atendido"];var n=(day%4)+1;cnt=n;for(var j=0;j<Math.min(n,3);j++){var sc=statusCfg(statuses[(day+j)%3]);dots+='<div class="d" style="background:'+sc.dot+'"></div>'}}

// Gera o documento via GPT a partir da anamnese/transcrição
function gerarDoc(mode,id){
  if(!aiReady()){alert("Backend de IA não conectado. Inicie o servidor (npm start) para gerar com IA.");return}
  var gen=mode==="tele"?state.teleGen:state.pres.docGen;
  var store=mode==="tele"?state.teleText:state.pres.docText;
  gen[id]="loading";render();
  var pt=selectedPatientForMode(mode==="tele"?"teleconsulta":"presencial")||{};
  var paciente={nome:pt.name||"Paciente",cpf:pt.cpf||"",plano:pt.plano||""};
  var anamnese=mode==="tele"?(state.teleTrans.anamData||null):(state.pres.anamData||null);
  var transcricao=mode==="tele"?(state.teleTrans.liveText||""):(state.pres.liveText||"");

  function enviarDocumento(anam){
    return OrtoguIA.gerarDocumento(id,{paciente:paciente,anamnese:anam,transcricao:transcricao,instrucoes:""})
      .then(function(texto){
        gen[id]="done";
        store[id]=formatMedicalDocument(mode,id,texto,pt);
        if(pt&&pt.id){
          saveDocumentToCloud(pt,mode==="tele"?"teleconsulta":"presencial",id,DOCS.filter(function(d){return d.id===id})[0].l,store[id],{anamnese:!!anam});
        }
        render();
      })
      .catch(function(e){gen[id]="done";alert("Falha ao gerar: "+e.message);render()});
  }

  // Em teleconsulta, tenta sempre estruturar a transcrição antes do documento.
  if(mode==="tele" && transcricao && !anamnese){
    OrtoguIA.gerarAnamnese({paciente:paciente,transcricao:transcricao})
      .then(function(data){state.teleTrans.anamData=data;state.teleTrans.anam=true;return enviarDocumento(data)})
      .catch(function(){state.teleTrans.anam=true;return enviarDocumento(null)});
    return;
  }

  enviarDocumento(anamnese);
}

return '<div><div class="h2">'+(sec?"Cadastro de Novo Paciente":"Novo Agendamento")+'</div><div class="sub">'+(sec?"Cadastro realizado pela secretaria":"Registro via central de atendimento")+'</div><div style="margin-top:18px"></div>'+ok+'<div class="card" style="padding:24px"><div class="form"><div><label class="lbl">Nome Completo *</label><input class="inp" value="'+esc(f.nome)+'" oninput="setForm(\x27nome\x27,this.value)" placeholder="Nome do paciente"></div><div class="frow"><div><label class="lbl">CPF *</label><input class="inp" value="'+esc(f.cpf)+'" oninput="setForm(\x27cpf\x27,this.value)" placeholder="000.000.000-00"></div><div><label class="lbl">Plano Amil</label><input class="inp" value="'+esc(f.plano)+'" oninput="setForm(\x27plano\x27,this.value)" placeholder="Ex: Amil S450"></div></div><div><label class="lbl">Queixa Principal</label><textarea class="inp" style="min-height:74px;resize:vertical" oninput="setForm(\x27queixa\x27,this.value)" placeholder="Descreva a queixa...">'+esc(f.queixa)+'</textarea></div><div class="frow"><div><label class="lbl">Tipo</label><select class="inp" onchange="setForm(\x27tipo\x27,this.value)"><option value="presencial"'+(f.tipo==="presencial"?" selected":"")+'>Presencial</option><option value="teleconsulta"'+(f.tipo==="teleconsulta"?" selected":"")+'>Teleconsulta</option></select></div><div><label class="lbl">Especialidade</label><select class="inp" onchange="setForm(\x27esp\x27,this.value)">'+esps+'</select></div><div><label class="lbl">Data</label><input class="inp" type="date" value="'+f.data+'" oninput="setForm(\x27data\x27,this.value)"></div><div><label class="lbl">Horário</label><input class="inp" type="time" value="'+f.hora+'" oninput="setForm(\x27hora\x27,this.value)"></div></div></div><div class="note">'+svg("whatsapp","ico-sm")+'<div>O paciente receberá automaticamente uma <strong style="color:#558776">mensagem via WhatsApp</strong> com confirmação da data, horário e tempo estimado de espera.</div></div><button class="submit" onclick="submitForm()">'+(sec?"Salvar Cadastro":"Confirmar Agendamento e Enviar WhatsApp")+'</button></div></div>';

function setForm(k,v){state.form[k]=v}
function submitForm(){
  var f=state.form;
  if(!f.nome||!f.cpf){alert("Preencha nome e CPF");return}
  var nextId=state.patients.reduce(function(m,p){return Math.max(m,Number(p.id)||0)},0)+1;
  state.patients.push(normalizePatient({
    id:nextId,
    name:f.nome,
    cpf:f.cpf,
    plano:f.plano||"Não informado",
    queixa:f.queixa||"Não informada",
    tipo:f.tipo,
    status:"aguardando",
    hora:f.hora||"08:00",
    esp:f.esp,
    data:f.data||todayIso(),
    aniversario:"",
    medicacao:"",
    consultasPrevias:0
  }));
  savePatients();
  auditLog("patient_register_or_schedule",{patientId:nextId,tipo:f.tipo,esp:f.esp});
  f.ok=true;
  render();
  setTimeout(function(){state.form={nome:"",cpf:"",plano:"",queixa:"",tipo:"presencial",esp:"Clínica Geral",data:"",hora:"",ok:false};render()},3000)
}
function viewLembretes(){
  var hoje=new Date();
  var mm=pad2(hoje.getMonth()+1);
  var dd=pad2(hoje.getDate());
  var alerta=[];
  var aniversarios=[];
  var meds=[];
  state.patients.forEach(function(p){
    var q=(p.queixa||"").toLowerCase();
    if(q.indexOf("febre")!==-1||q.indexOf("ferimentos extensos")!==-1||q.indexOf("piora")!==-1||(p.consultasPrevias||0)>2){
      alerta.push('<div class="line"><div class="av pa">AL</div><div class="bub"><div class="sp">'+esc(p.name)+'</div><div class="tx">'+esc(p.queixa)+' · '+((p.consultasPrevias||0)>2?"Mais que duas consultas":"Sinal de alerta")+'</div></div></div>');
    }
    if((p.aniversario||"").slice(5)===mm+"-"+dd){
      aniversarios.push('<div class="line"><div class="av pa">AN</div><div class="bub"><div class="sp">'+esc(p.name)+'</div><div class="tx">Aniversário hoje · '+esc(p.aniversario)+'</div></div></div>');
    }
    if(p.medicacao){
      meds.push('<div class="line"><div class="av pa">MD</div><div class="bub"><div class="sp">'+esc(p.name)+'</div><div class="tx">'+esc(p.medicacao)+'</div></div></div>');
    }
  });
  var alertaBlock=alerta.length?alerta.join(""):'<div class="empty" style="padding-top:26px">Sem alertas críticos no momento.</div>';
  var anivBlock=aniversarios.length?aniversarios.join(""):'<div class="empty" style="padding-top:26px">Sem aniversários hoje.</div>';
  var medBlock=meds.length?meds.join(""):'<div class="empty" style="padding-top:26px">Sem lembretes de medicação.</div>';
  return '<div><div class="h2">Lembretes Importantes</div><div class="sub">Acompanhamento da secretaria</div><div class="grid2" style="margin-top:18px"><div class="card"><div class="ahead" style="display:block"><div class="tt">'+svg("alert","ico-sm")+'Sinais de Alerta para Contato</div><div class="ds">Febre, ferimentos extensos, piora clínica ou mais de duas consultas</div></div><div class="scroll">'+alertaBlock+'</div></div><div class="card"><div class="ahead" style="display:block"><div class="tt">'+svg("star","ico-sm")+'Aniversários</div><div class="ds">Pacientes com aniversário no dia</div></div><div class="scroll">'+anivBlock+'</div></div></div><div class="card" style="margin-top:14px"><div class="ahead" style="display:block"><div class="tt">'+svg("notes","ico-sm")+'Lembretes de Medicações</div><div class="ds">Mensagens e reforços importantes para o contato</div></div><div class="scroll">'+medBlock+'</div></div></div>';
}

function viewLgpd(){
  if(!canAccessTab("lgpd"))return '<div><div class="h2">LGPD</div><div class="sub">Acesso restrito</div><div class="card" style="padding:16px;margin-top:14px">Seu perfil não possui permissão para governança de dados.</div></div>';

    return '<tr>'
      +'<td style="padding:10px;border-bottom:1px solid #E6EDF0">'+esc(p.name||"")+'</td>'
      +'<td style="padding:10px;border-bottom:1px solid #E6EDF0">'+esc(p.cpf||"")+'</td>'
      +'<td style="padding:10px;border-bottom:1px solid #E6EDF0">'+esc((p.retentionUntil||"").slice(0,10))+'</td>'
      +'<td style="padding:10px;border-bottom:1px solid #E6EDF0"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="headbtn" onclick="exportPatientData('+Number(p.id||0)+')">'+svg("download","ico-sm")+'Exportar</button><button class="headbtn" style="color:#C23C3A;border-color:#F1C9C7" onclick="deletePatientData('+Number(p.id||0)+')">'+svg("trash","ico-sm")+'Eliminar</button></div></td>'

  var logs=readAuditLogs().slice(-20).reverse().map(function(l){

      +'</tr>';
  }).join("");
  return '<div><div class="h2">Governança LGPD</div><div class="sub">Consentimento, retenção, exportação e eliminação de dados</div>'
    +'<div class="card" style="padding:16px;margin-top:14px"><div class="frow"><div><label class="lbl">Retenção (dias)</label><input class="inp" type="number" min="30" value="'+state.lgpd.retentionDays+'" oninput="setRetentionDays(this.value)"></div><div style="display:flex;align-items:flex-end"><button class="sessionbtn" onclick="runRetentionNow()">'+svg("lgpd","ico-sm")+'Executar Expurgo Agora</button></div></div><div class="sub" style="margin-top:8px">Último expurgo: '+esc(state.lgpd.lastPurgeAt?state.lgpd.lastPurgeAt.replace("T"," ").slice(0,19):"não executado")+' · itens removidos: '+Number(state.lgpd.expurged||0)+'</div></div>'
    +'<div class="card" style="margin-top:14px"><div class="ahead" style="display:block"><div class="tt">'+svg("user","ico-sm")+'Direitos do Titular (Paciente)</div><div class="ds">Exportação e eliminação por paciente</div></div><div style="padding:10px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:10px;border-bottom:1px solid #E6EDF0">Paciente</th><th style="text-align:left;padding:10px;border-bottom:1px solid #E6EDF0">CPF</th><th style="text-align:left;padding:10px;border-bottom:1px solid #E6EDF0">Retenção até</th><th style="text-align:left;padding:10px;border-bottom:1px solid #E6EDF0">Ações</th></tr></thead><tbody>'+(patientsRows||'<tr><td colspan="4" style="padding:14px;color:#A2ABAE">Nenhum paciente cadastrado.</td></tr>')+'</tbody></table></div></div>'
    +'<div class="card" style="margin-top:14px"><div class="ahead" style="display:block"><div class="tt">'+svg("clipboard","ico-sm")+'Trilha de Auditoria</div><div class="ds">Eventos recentes com perfil, ação e resultado</div></div><div style="padding:10px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:8px;border-bottom:1px solid #E6EDF0">Data/Hora</th><th style="text-align:left;padding:8px;border-bottom:1px solid #E6EDF0">Usuário</th><th style="text-align:left;padding:8px;border-bottom:1px solid #E6EDF0">Ação</th><th style="text-align:left;padding:8px;border-bottom:1px solid #E6EDF0">Resultado</th></tr></thead><tbody>'+(logs||'<tr><td colspan="4" style="padding:14px;color:#A2ABAE">Sem eventos.</td></tr>')+'</tbody></table></div></div>'
    +'</div>';
}
function render(){
  if(!requireValidSession())return;
  if(!canAccessTab(state.tab)){auditLog("tab_access_denied",{tab:state.tab},"denied");state.tab=navForRole()[0].id}
  syncProfileUI();
  renderNav();
  var v=document.getElementById("view");
  if(state.tab==="agenda")v.innerHTML=viewAgenda();
  else if(state.tab==="teleconsulta")v.innerHTML=viewTele();
  else if(state.tab==="presencial")v.innerHTML=viewPres();
  else if(state.tab==="agendamento")v.innerHTML=viewAgend();
  else if(state.tab==="assistentes")v.innerHTML=viewAssistentes();
  else if(state.tab==="lembretes")v.innerHTML=viewLembretes();
  else if(state.tab==="relatorios")v.innerHTML=viewRel();
  else if(state.tab==="lgpd")v.innerHTML=viewLgpd();
}
if(requireValidSession()){
  runRetentionNow();
  auditLog("session_open",{tab:state.tab});
  render();
}

<!-- Conexão com o backend de agentes de IA (transcrição + documentos) -->
<script src="ortoguia-agents.js"></script>
<script>
  // Configuração automática por ambiente.
  // Localhost -> backend local; produção -> tenta subdomínio API e cai para mesmo host.
  (function () {
    var session={};
    try{session=JSON.parse(localStorage.getItem("ortopguia:session")||"{}")||{}}catch(e){session={}}
    var isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";
    var candidates = isLocal
      ? ["http://localhost:8787"]
      : ["https://api.ortopguia.com.br", window.location.origin];

    function tryCandidate(i) {
      if (i >= candidates.length) {
        window.__ORTO_AI_READY = false;
        return;
      }

      OrtoguIA.config({ baseUrl: candidates[i], authToken: session.accessToken || "" });
      OrtoguIA.ping(2500)
        .then(function (ok) {
          if (ok) {
            window.__ORTO_AI_READY = true;
            return;
          }
          tryCandidate(i + 1);
        })
        .catch(function () {
          tryCandidate(i + 1);
        });
    }

    // Ativa IA real somente quando o backend estiver acessível.
    tryCandidate(0);
  })();
</script>
